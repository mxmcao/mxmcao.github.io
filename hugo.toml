baseURL = "https://mxmcao.github.io/"
languageCode = "en-us"
title = "mxmcao"
copyright = ""
[pagination]
  pagerSize = 5

[markup.highlight]
  noClasses = false

[params]
  contentTypeName = "posts"
  showMenuItems = 3
  showLanguageSelector = false
  fullWidthTheme = false
  centerTheme = true
  autoCover = true
  showLastUpdated = false
  author = "mxmcao"
  description = "A minimal terminal-themed academic homepage."

[languages]
  [languages.en]
    languageName = "English"
    title = "mxmcao"

    [languages.en.params]
      subtitle = "Academic homepage"
      owner = ""
      keywords = "academic homepage, research"
      copyright = ""
      menuMore = "Show more"
      readMore = "Read more"
      readOtherPosts = "Read other posts"
      newerPosts = "Newer posts"
      olderPosts = "Older posts"
      missingContentMessage = "Page not found"
      missingBackButtonLabel = "Back to home page"
      minuteReadingTime = "min read"
      words = "words"

      [languages.en.params.logo]
        logoText = "$ mxmcao"
        logoHomeLink = "/"

    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "about"
        name = "About"
        url = "/"
        weight = 1

      [[languages.en.menu.main]]
        identifier = "research"
        name = "Research"
        url = "/research/"
        weight = 2

      [[languages.en.menu.main]]
        identifier = "cv"
        name = "CV"
        url = "/cv/"
        weight = 3

[module]
  [module.hugoVersion]
    extended = true
    min = "0.90.0"

  [[module.imports]]
    path = "github.com/panr/hugo-theme-terminal/v4"
