baseURL = "https://mxmcao.github.io/"
languageCode = "en-us"
title = "Jiaqi Cao"
copyright = ""
[pagination]
  pagerSize = 5

[markup.highlight]
  noClasses = false

[params]
  contentTypeName = "posts"
  showMenuItems = 3
  showLanguageSelector = false
  fullWidthTheme = false
  centerTheme = true
  autoCover = true
  showLastUpdated = false
  author = "Jiaqi Cao"
  description = "Jiaqi Cao's academic homepage. LLM architectures, parametric memory, and continual learning."

[languages]
  [languages.en]
    languageName = "English"
    title = "Jiaqi Cao"

    [languages.en.params]
      subtitle = "LLM Researcher at Shanghai Jiao Tong University"
      owner = "Jiaqi Cao"
      keywords = "Jiaqi Cao, Max Cao, LLM architecture, parametric memory, continual learning, Shanghai Jiao Tong University"
      copyright = ""
      menuMore = "Show more"
      readMore = "Read more"
      readOtherPosts = "Read other posts"
      newerPosts = "Newer posts"
      olderPosts = "Older posts"
      missingContentMessage = "Page not found"
      missingBackButtonLabel = "Back to home page"
      minuteReadingTime = "min read"
      words = "words"

      [languages.en.params.logo]
        logoText = "$ mxmcao"
        logoHomeLink = "/"

    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "about"
        name = "About"
        url = "/"
        weight = 1

      [[languages.en.menu.main]]
        identifier = "research"
        name = "Research"
        url = "/research/"
        weight = 2

      [[languages.en.menu.main]]
        identifier = "cv"
        name = "CV"
        url = "/cv/"
        weight = 3

[module]
  [module.hugoVersion]
    extended = true
    min = "0.90.0"

  [[module.imports]]
    path = "github.com/panr/hugo-theme-terminal/v4"

  [[module.mounts]]
    source = "assets"
    target = "assets"

  [[module.mounts]]
    source = "content"
    target = "content"

  [[module.mounts]]
    source = "data"
    target = "data"

  [[module.mounts]]
    source = "layouts"
    target = "layouts"

  [[module.mounts]]
    source = "static"
    target = "static"

  [[module.mounts]]
    source = "prev-information/personal/profile.png"
    target = "static/images/profile.png"

  [[module.mounts]]
    source = "prev-information/publications/images"
    target = "static/images/publications"
