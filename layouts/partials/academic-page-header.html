{{- $page := .page -}}
<header class="academic-page-header">
  <h1 class="post-title academic-page-header__title" id="{{ .id }}">
    <span class="academic-page-header__prompt" aria-hidden="true">&gt;</span>
    <a class="academic-page-header__title-link" href="{{ $page.Permalink }}">{{ $page.Title | markdownify }}</a>
    {{- with .supplementURL }}
      <span class="publication-page__scholar">
        {{ $.supplementText }}
        <a href="{{ . }}" target="_blank" rel="noopener noreferrer">{{ $.supplementLabel }}</a>.
      </span>
    {{- end }}
  </h1>
</header>
